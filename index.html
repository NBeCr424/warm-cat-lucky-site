<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>暖暖猫咪幸运站 - 欢迎页</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="paw-bg welcome-entry">
<div class="bg-cute" id="bgCute"></div>
<main>
  <section class="hero welcome-hero">
    <h1 class="welcome-title"><span class="cat-mini">🐱</span> 暖暖猫咪幸运站 <span class="cat-mini">🐱</span></h1>
    <p class="welcome-sub">欢迎来到今日治愈小宇宙。先收下祝福，再决定要不要立刻开始游戏。🐾</p>

    <div class="emoji-wall" aria-label="可爱图标互动区">
      <button class="emoji-chip" type="button" data-link-card="0" data-word="今天适合轻轻出发，也会稳稳抵达。" aria-label="元气祝福">😺</button>
      <button class="emoji-chip" type="button" data-link-card="1" data-word="你认真生活的样子，本来就很闪亮。" aria-label="鼓励祝福">✨</button>
      <button class="emoji-chip" type="button" data-link-card="2" data-word="把节奏放慢一点，心会更亮一点。" aria-label="慢节奏祝福">🐾</button>
      <button class="emoji-chip" type="button" data-link-card="0" data-word="好运正在靠近，记得给自己一个微笑。" aria-label="好运祝福">🍀</button>
      <button class="emoji-chip" type="button" data-link-card="1" data-word="今天也会有可爱的惊喜在等你。" aria-label="惊喜祝福">🎀</button>
      <button class="emoji-chip" type="button" data-link-card="2" data-word="愿你被温柔抱住，烦恼都变轻。" aria-label="治愈祝福">💗</button>
      <button class="emoji-chip" type="button" data-link-card="0" data-word="你的小愿望，正在一点点靠近。" aria-label="愿望祝福">🧶</button>
      <button class="emoji-chip" type="button" data-link-card="1" data-word="先照顾好自己，今天就已经很棒了。" aria-label="陪伴祝福">🌸</button>
      <button class="emoji-chip" type="button" data-link-card="2" data-word="猫咪说：喵呜，今天也请你开心。" aria-label="猫咪祝福">🐱</button>
    </div>

    <div class="bless-grid" aria-label="祝福文案框">
      <button class="bless-card c1" type="button" data-text="愿你今天被好运抱住，烦恼自动变小。✨" aria-label="祝福卡片一">愿你今天被好运抱住，烦恼自动变小。✨</button>
      <button class="bless-card c2 active" type="button" data-text="愿你想做的事，都能顺顺利利开始。❤️" aria-label="祝福卡片二">愿你想做的事，都能顺顺利利开始。❤️</button>
      <button class="bless-card c3" type="button" data-text="愿你和可爱的小猫一样，元气又自在。🐱" aria-label="祝福卡片三">愿你和可爱的小猫一样，元气又自在。🐱</button>
    </div>

    <nav class="entry-steps" aria-label="三层流程导航">
      <div class="entry-step-row">
        <button class="entry-step-btn done" type="button" aria-label="第一层"><span>🐾</span><span>猫咪小档案</span></button>
        <button class="entry-step-btn" type="button" aria-label="第二层"><span>✨</span><span>喵系幸运签</span></button>
        <button class="entry-step-btn" type="button" aria-label="第三层"><span>🎀</span><span>换装小诗馆</span></button>
      </div>
      <div class="entry-progress" aria-hidden="true">
        <span class="entry-node done"></span>
        <span class="entry-node on"></span>
        <span class="entry-node"></span>
        <span class="entry-line"><i class="entry-line-fill"></i></span>
      </div>
    </nav>

    <article class="welcome-panel">
      <span class="tag">入口页</span>
      <h2>现在开始游戏吗？</h2>
      <p class="welcome-greeting" id="welcomeGreeting">欢迎回来，<b class="welcome-name" id="userName">小可爱</b></p>
      <small class="flow-lines">
        <span class="flow-line">🐾 <b>猫咪小档案</b>：记录今天的你</span>
        <span class="flow-line">✨ <b>喵系幸运签</b>：收下今日好运提示</span>
        <span class="flow-line">🎀 <b>换装小诗馆</b>：生成专属治愈时刻</span>
      </small>

      <div class="row welcome-actions">
        <button id="startGame" class="pri" type="button" aria-label="继续游戏">继续游戏</button>
        <button id="laterBtn" class="sec" type="button" aria-label="稍后开始">先收下祝福</button>
      </div>
      <div class="status welcome-status" id="welcomeStatus" aria-live="polite"></div>
      <div class="today-tip" id="todayTip" aria-live="polite"></div>

      <div class="music-zone">
        <div class="music-pet" id="musicPet" aria-hidden="true">🐱</div>
        <div class="music-controls">
          <button id="musicToggle" class="sec music-btn" type="button" aria-label="播放或暂停舒缓音乐">🎵 播放舒缓音乐</button>
          <label class="volume-shell" for="musicVolume">
            <span>音量</span>
            <input id="musicVolume" type="range" min="0" max="100" value="40" aria-label="音乐音量" />
            <b id="volumeText">40%</b>
          </label>
        </div>
      </div>
    </article>
    <section class="entry-cats" aria-label="入口页猫咪展示区">
      <button class="entry-cat yellow" type="button" aria-label="元气黄猫">
        <span class="entry-cat-eye left"></span>
        <span class="entry-cat-eye right"></span>
        <span class="entry-cat-mouth">ω</span>
      </button>
      <button class="entry-cat white" type="button" aria-label="温柔白猫">
        <span class="entry-cat-eye left"></span>
        <span class="entry-cat-eye right"></span>
        <span class="entry-cat-mouth">ω</span>
      </button>
      <button class="entry-cat gray" type="button" aria-label="佛系灰猫">
        <span class="entry-cat-eye left"></span>
        <span class="entry-cat-eye right"></span>
        <span class="entry-cat-mouth">ω</span>
      </button>
    </section>
    <div class="entry-silhouette" aria-hidden="true">🐈  🐾  🐈</div>
  </section>
</main>

<audio id="bgMusic" preload="auto" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg" />
</audio>

<script src="common.js"></script>
<script>
const E={
  bgCute:document.getElementById("bgCute"),
  startGame:document.getElementById("startGame"),
  laterBtn:document.getElementById("laterBtn"),
  welcomeGreeting:document.getElementById("welcomeGreeting"),
  userName:document.getElementById("userName"),
  welcomeStatus:document.getElementById("welcomeStatus"),
  todayTip:document.getElementById("todayTip"),
  blessCards:Array.from(document.querySelectorAll(".bless-card")),
  emojiChips:Array.from(document.querySelectorAll(".emoji-chip")),
  entryCats:Array.from(document.querySelectorAll(".entry-cat")),
  musicToggle:document.getElementById("musicToggle"),
  musicVolume:document.getElementById("musicVolume"),
  volumeText:document.getElementById("volumeText"),
  musicPet:document.getElementById("musicPet"),
  bgMusic:document.getElementById("bgMusic")
};

const LATER_WORDS=[
  "先摸摸小猫再出发，今天也会很顺。🐾",
  "祝福已装进背包，随时都能开始。✨",
  "慢慢来也很好，幸运会等你。💗",
  "给你一颗暖暖小心心：准备好再点开始。🌸"
];

function popHint(msg){
  const el=document.createElement("div");
  el.className="hint-pop";
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1700);
}

function sprinkleAt(x,y,count=8,pool=["💗","🐾","✨","🧡"]){
  for(let i=0;i<count;i+=1){
    const el=document.createElement("span");
    el.className="entry-drop";
    el.textContent=pool[Math.floor(Math.random()*pool.length)];
    el.style.left=`${x+(Math.random()*42-21)}px`;
    el.style.top=`${y+(Math.random()*20-10)}px`;
    el.style.setProperty("--dx",`${Math.random()*110-55}px`);
    el.style.setProperty("--dy",`${-55-Math.random()*95}px`);
    el.style.setProperty("--dr",`${Math.random()*120-60}deg`);
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1200);
  }
}

function burstFromEl(node){
  const rect=node.getBoundingClientRect();
  sprinkleAt(rect.left+rect.width*0.5,rect.top+rect.height*0.5,10);
}

function linkIconToCard(icon,card){
  const from=icon.getBoundingClientRect();
  const to=card.getBoundingClientRect();
  const cat=document.createElement("span");
  cat.className="icon-cat-link";
  cat.textContent="🐱";
  cat.style.left=`${from.left+from.width/2}px`;
  cat.style.top=`${from.top+from.height/2}px`;
  cat.style.setProperty("--mx",`${(to.left+to.width/2)-(from.left+from.width/2)}px`);
  cat.style.setProperty("--my",`${(to.top-14)-(from.top+from.height/2)}px`);
  document.body.appendChild(cat);
  setTimeout(()=>cat.remove(),900);
}

function setTip(profile){
  const fortune=WarmCat.readJSON(WarmCat.KEYS.fortune);
  const hour=new Date().getHours();
  let msg="今日运势小提示：把肩膀放松一点，好运更容易靠近你。";
  if(fortune&&fortune.date===WarmCat.day()&&profile&&fortune.name===profile.name){
    msg=`今日运势小提示：你的关键词是「${fortune.keyword||fortune.title||"温柔"}」，慢慢来会更顺。`;
  }else if(hour>=22||hour<6){
    msg="今日运势小提示：夜晚适合慢慢收心，明天会更亮。";
  }else if(hour>=6&&hour<12){
    msg="今日运势小提示：早晨行动力不错，先做一件小事就很好。";
  }
  E.todayTip.textContent=msg;
}

function setGreeting(profile){
  const name=(profile&&profile.name)?profile.name:"小可爱";
  E.userName.textContent=name;
  E.welcomeGreeting.innerHTML=`欢迎回来，<b class="welcome-name">${name}</b>`;
  if(profile&&profile.name){
    E.startGame.textContent="继续游戏";
    E.welcomeStatus.textContent=`欢迎回来，${name}。可以继续你的猫咪幸运之旅。`;
  }else{
    E.startGame.textContent="开始游戏";
    E.welcomeStatus.textContent=WarmCat.timeGreeting();
  }
  setTip(profile);
}

E.startGame.onclick=()=>{
  E.startGame.classList.add("btn-loading");
  popHint("出发咯，去第一层填写信息～");
  burstFromEl(E.startGame);
  setTimeout(()=>{location.href="layer1.html";},420);
};

E.laterBtn.onclick=()=>{
  const msg=LATER_WORDS[Math.floor(Math.random()*LATER_WORDS.length)];
  E.welcomeStatus.textContent=msg;
  burstFromEl(E.laterBtn);
  popHint("祝福+1 ✨");
};

E.emojiChips.forEach((chip)=>{
  chip.addEventListener("click",()=>{
    const msg=chip.dataset.word||"愿你今天被温柔接住。";
    E.welcomeStatus.textContent=msg;
    const idx=Number(chip.dataset.linkCard||0);
    const card=E.blessCards[Math.max(0,Math.min(E.blessCards.length-1,idx))];
    if(card){
      E.blessCards.forEach((x)=>x.classList.remove("active"));
      card.classList.add("active");
      linkIconToCard(chip,card);
    }
    burstFromEl(chip);
    popHint("喵呜祝福到达 💗");
  });
});

E.blessCards.forEach((card)=>{
  card.addEventListener("click",()=>{
    E.blessCards.forEach((x)=>x.classList.remove("active"));
    card.classList.add("active");
    E.welcomeStatus.textContent=card.dataset.text||card.textContent;
    burstFromEl(card);
  });
});

E.entryCats.forEach((cat)=>{
  cat.addEventListener("click",()=>{
    cat.classList.remove("tilt");
    void cat.offsetWidth;
    cat.classList.add("tilt");
    burstFromEl(cat);
    sprinkleAt(cat.getBoundingClientRect().left+cat.getBoundingClientRect().width/2,cat.getBoundingClientRect().top+8,2,["💗","💖"]);
    setTimeout(()=>cat.classList.remove("tilt"),360);
  });
});

WarmCat.initCuteBg(E.bgCute);
const musicCtrl=WarmCat.initMusic(E.musicToggle,E.musicVolume,E.bgMusic,E.welcomeStatus);
const profile=WarmCat.readJSON(WarmCat.KEYS.profile);
setGreeting(profile);
if(musicCtrl&&musicCtrl.onVolumeChange){
  musicCtrl.onVolumeChange((_,percent)=>{
    E.volumeText.textContent=`${percent}%`;
  });
}
if(musicCtrl&&musicCtrl.onPlayChange){
  musicCtrl.onPlayChange((playing)=>{
    E.musicPet.classList.toggle("on",playing);
    E.musicToggle.textContent=playing?"🎵 暂停舒缓音乐":"🎵 播放舒缓音乐";
    if(playing){
      burstFromEl(E.musicToggle);
    }
  });
}
</script>
</body>
</html>
